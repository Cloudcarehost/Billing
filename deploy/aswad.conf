[program:aswad-queue]
directory=/path/to/backend
command=php artisan queue:work --queue=broadcasts,default --tries=5 --timeout=90 --sleep=1
autostart=true
autorestart=true
stopwaitsecs=60
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/aswad-queue.log

[program:aswad-reverb]
directory=/path/to/backend
command=php artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/aswad-reverb.log
