name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require deploy secrets
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
          KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PATH_NAME: ${{ secrets.PRODUCTION_PATH }}
        run: |
          missing=""
          [ -z "$HOST" ] && missing="$missing PRODUCTION_HOST"
          [ -z "$USER" ] && missing="$missing PRODUCTION_USER"
          [ -z "$KEY" ] && missing="$missing PRODUCTION_SSH_KEY"
          [ -z "$PATH_NAME" ] && missing="$missing PRODUCTION_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Add these GitHub Actions secrets before Deploy can SSH to Hestia:$missing"
            exit 1
          fi
      - uses: actions/checkout@v5
      - name: Pull and release on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.PRODUCTION_PATH }}"
            APP_DIR="$(pwd)"
            ME="$(whoami)"
            OWNER="$(stat -c '%U' "$APP_DIR")"
            git config --global --add safe.directory "$APP_DIR"
            if [ ! -w "$APP_DIR/.git" ]; then
              echo "Git metadata is not writable by $ME (owner is $OWNER). Repairing..."
              if ! sudo -n chown -R "$ME:$ME" "$APP_DIR"; then
                echo "Could not chown $APP_DIR. SSH in as admin and run:"
                echo "  sudo chown -R $ME:$ME $APP_DIR"
                exit 1
              fi
            fi
            git fetch origin main
            git reset --hard origin/main
            bash deploy/release.sh
