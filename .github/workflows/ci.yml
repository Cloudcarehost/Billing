name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3, tokenizer, xml, ctype, json, bcmath, gmp, curl, openssl
          coverage: none
      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php -r "file_put_contents('.env', preg_replace('/^APP_KEY=.*/m', 'APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=', file_get_contents('.env')));"
          mkdir -p database storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          touch database/database.sqlite
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          BROADCAST_CONNECTION: "null"
      - name: Discover packages
        run: |
          composer dump-autoload --optimize
          php artisan package:discover --ansi
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          BROADCAST_CONNECTION: "null"
      - name: Tests
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.test
          VITE_REVERB_APP_KEY: aswad-ci
          VITE_REVERB_HOST: api.example.test
          VITE_REVERB_PORT: "443"
          VITE_REVERB_SCHEME: https
